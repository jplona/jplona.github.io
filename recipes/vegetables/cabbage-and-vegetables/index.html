      <h1>Cabbage &amp; Vegetables</h1>
      <p class="card-subtitle">From the kitchen of Mary C. Plona</p>
      <dl class="card-meta">
        <div><dt>Category</dt><dd><a href="/#cat-vegetables">Vegetables</a></dd></div><div><dt>Prep time</dt><dd>15 min.</dd></div><div><dt>Servings</dt><dd>6-8</dd></div>
      </dl>
    </header>
    
      <div class="recipe-columns">
        <section class="ingredients-col">
          <h2>Ingredients</h2>
          <ul class="ingredient-list">
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>3 cups Cabbage</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>1 cup Celery</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>1 cup Green Pepper</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>1/4 cup Onion, chopped</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>1 1/2 tsp Salt</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>2 tbsp Bacon Drippings</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>2 tbsp Water</span></label></li>
        <li class="ingredient-item"><label class="ingredient-check"><input type="checkbox"><span>Pepper to Taste</span></label></li>
        </ul>
        </section>
        <section class="instructions-col">
          <h2>Instructions</h2>
          <p>Combine ingredients and cook about 10 min. Good with Ham or Pork.</p>

name: Rebuild Recipe Site

on:
  push:
    branches:
      - master
    paths:
      - "content/**"
      - "scripts/build.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static site
        run: python3 scripts/build.py
      - name: Commit rebuilt HTML if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html all/ recipes/ assets/ favicon.svg .nojekyll
            git commit -m "Rebuild static recipe site"
            git push
          fi
